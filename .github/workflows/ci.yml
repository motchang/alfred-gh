name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-gh
          path: dist/*.alfredworkflow
